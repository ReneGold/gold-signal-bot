name: Gold V5 Handelszeiten A B Vergleich (manuell)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Nur Test-Branch laden
        uses: actions/checkout@v4
        with:
          ref: gold-bot-v3-9-5-test
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt
      - name: Historische Gold-Kerzen laden
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_data_quality_audit.py
      - name: A B Handelszeiten-Vergleich
        run: python gold_v5_session_ab.py
      - name: Vergleichsbericht und Trades exportieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v5-session-ab-${{ github.run_id }}
          path: |
            gold_data_audit/gold_v5_session_ab_trades.csv
            gold_data_audit/gold_v5_session_ab_summary.json
          if-no-files-found: warn
