name: Daytrader V1 historical collection pilot
on:
  push:
    branches: [gold-ai-daytrader-1]
    paths:
      - '.github/workflows/daytrader-v1-history-collect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DAYTRADER_V1_ENABLED: '0'
      DAYTRADER_V1_TELEGRAM_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Collect first four historical windows
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          mkdir -p daytrader-history
          python -m daytrader_v1.history_collect --out daytrader-history --budget 4 > daytrader-history/report.json
          python -c "import json; r=json.load(open('daytrader-history/report.json')); print(r['status'], 'requests used:', r.get('requests_used')); print('Saved windows:', sum(x['present'] for x in r.get('windows', [])))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daytrader-v1-history-pilot
          path: daytrader-history/
          if-no-files-found: warn
