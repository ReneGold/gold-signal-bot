name: Daytrader V1 historical collection pilot
on:
  push:
    branches: [gold-ai-daytrader-1]
    paths:
      - '.github/workflows/daytrader-v1-history-collect.yml'
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: 'Successful prior collection run ID'
        required: true
        default: '45898865709'
permissions:
  contents: read
  actions: read
concurrency:
  group: daytrader-v1-history-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DAYTRADER_V1_ENABLED: '0'
      DAYTRADER_V1_TELEGRAM_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: daytrader-v1-history-pilot
          path: daytrader-history/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.previous_run_id || '45898865709' }}
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Collect remaining historical windows in bounded batches
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import json, pathlib, time
          from daytrader_v1.history_collect import collect
          root = pathlib.Path("daytrader-history")
          total = 0
          for batch in range(16):
              # At most four requests per batch, at most 64 per workflow.
              report = collect(root, 4)
              total += report.get("requests_used", 0)
              report["workflow_requests_used"] = total
              tmp = root / "report.tmp"
              tmp.write_text(json.dumps(report, indent=2))
              tmp.replace(root / "report.json")
              status = report["status"]
              print("Batch", batch+1, status, "requests:", total,
                    "saved windows:", sum(x["present"] for x in report.get("windows", [])), flush=True)
              if status != "PARTIAL" or report.get("requests_used", 0) == 0:
                  break
              if batch < 15:
                  time.sleep(65)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daytrader-v1-history-pilot
          path: daytrader-history/
          if-no-files-found: error
