
name: Historical Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Python-Syntax pruefen
        run: python -m py_compile gold_v395_100_kerzen_analyse.py
      
      - name: Gold Bot V3.9.5 Diagnose
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          STATE_FILE: /tmp/gold-v395-test-state.json
          RUN_ONCE: "true"
        run: python gold_v395_100_kerzen_analyse.py
