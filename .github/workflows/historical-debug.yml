
name: Historical Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Risk Manager Unit-Tests
        run: python -m unittest -v test_gold_risk_manager.py

      - name: Time Machine Unit-Tests
        run: python -m unittest -v test_gold_time_machine.py

      - name: Entry Timer Unit-Tests
        run: python -m unittest -v test_gold_entry_timer.py

      - name: Exit Planner Unit-Tests
        run: python -m unittest -v test_gold_exit_planner.py

      - name: News- und Volatilitaetsfilter Unit-Tests
        run: python -m unittest -v test_gold_news_volatility_filter.py

      - name: V4 Integration Unit-Tests
        run: python -m unittest -v test_gold_v4_research_pipeline.py

      - name: V4 Marktdaten-Anbindung Unit-Tests
        run: python -m unittest -v test_gold_v4_market_observer.py

      - name: V4 Wirtschaftskalender Unit-Tests
        run: python -m unittest -v test_gold_v4_calendar.py

      - name: Kostenloser Wirtschaftskalender Unit-Tests
        run: python -m unittest -v test_gold_v4_free_calendar.py

      - name: Kostenlosen US-Kalender live abfragen (nur Diagnose)
        run: python gold_v4_free_calendar.py

      - name: V4 US-Nachrichtensperre Grenzwerte testen
        run: python -m unittest -v test_gold_v4_news_blackout.py

      - name: Python-Syntax pruefen
        run: python -m py_compile gold_pilot_backtest.py
      
      
      - name: Gold Backtest Pilot ausfuehren
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_pilot_backtest.py

      - name: Backtest-CSV bereitstellen
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-pilot-backtest-trades
          path: gold_pilot_backtest_trades.csv
          if-no-files-found: error
          retention-days: 30

      - name: Historische Gold-Daten August bis Oktober abrufen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_historical_fetch.py

      - name: Historische Kursdaten als ZIP bereitstellen
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-historical-2026-08-to-10
          path: gold_historical_data/*.csv
          if-no-files-found: error
          retention-days: 14

      - name: Gold Langzeit Backtest Score 60 65 70
        run: python gold_long_backtest.py

      - name: Langzeit Backtest CSV exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-long-backtest-results
          path: gold_long_backtest_trades.csv
          if-no-files-found: error
          retention-days: 30

      - name: Langzeit Backtest Verluste analysieren
        run: python gold_long_diagnostics.py

      - name: Verlustanalyse CSV exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-long-backtest-diagnostics
          path: gold_long_backtest_diagnostics.csv
          if-no-files-found: error
          retention-days: 30

      - name: Timing und Same-Candle-Ausstiege pruefen
        run: python gold_trade_timing_audit.py

      - name: Timing-Pruefbericht exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-trade-timing-audit
          path: gold_trade_timing_audit.csv
          if-no-files-found: error
          retention-days: 30

      - name: Gold V3.9.6 konservativen Backtest ausfuehren
        run: python gold_long_backtest_v396.py && mv gold_long_backtest_trades.csv gold_long_backtest_v396_trades.csv

      - name: V3.9.6 Vergleichs-Trades exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-backtest-v396-results
          path: gold_long_backtest_v396_trades.csv
          if-no-files-found: error
          retention-days: 30

      - name: V3.9.6 Zeitraumvergleich August September Oktober
        run: python gold_v396_chronological_report.py

      - name: Zeitraumvergleich als CSV bereitstellen
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-v396-period-comparison
          path: gold_v396_chronological_report.csv
          if-no-files-found: error
          retention-days: 30

      - name: Score 65 A-B Trend Momentum Vergleich
        run: python gold_ab_score65.py

      - name: Score 65 A-B Ergebnisse exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-score65-ab-comparison
          path: gold_ab_score65_trades.csv
          if-no-files-found: error
          retention-days: 30

      - name: Score 65 A-B Monatsstabilitaet pruefen
        run: python gold_ab_score65_stability.py

      - name: Score 65 Stabilitaetsbericht exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-score65-monthly-stability
          path: gold_ab_score65_stability.csv
          if-no-files-found: error
          retention-days: 30

      - name: Score 65 Marktphasenfilter A-B-C vergleichen
        run: python gold_market_phase_score65.py

      - name: V4 Backtest Rechenpruefung
        run: python -m unittest -v test_gold_v4_paired_exit_backtest.py

      - name: V4 Teilgewinn-Backtest gegen B und C
        run: python gold_v4_paired_exit_backtest.py

      - name: V4 Vergleichsergebnisse exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-v4-exit-comparison
          path: |
            gold_v4_paired_exit_trades.csv
            gold_v4_paired_exit_summary.csv
          if-no-files-found: error
          retention-days: 30

      - name: Score 65 Marktphasenvergleich CSV exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-score65-market-phase
          path: gold_market_phase_score65_trades.csv
          if-no-files-found: error
          retention-days: 30

      - name: Marktphasen B-C Monatsvergleich
        run: python gold_market_phase_monthly.py

      - name: Marktphasen B-C Monatsbericht exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-market-phase-monthly-comparison
          path: gold_market_phase_monthly_report.csv
          if-no-files-found: error
          retention-days: 30
