
name: Historical Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Python-Syntax pruefen
        run: python -m py_compile gold_pilot_backtest.py
      
      
      - name: Gold Backtest Pilot ausfuehren
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_pilot_backtest.py

      - name: Backtest-CSV bereitstellen
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-pilot-backtest-trades
          path: gold_pilot_backtest_trades.csv
          if-no-files-found: error
          retention-days: 30

      - name: Historische Gold-Daten August bis Oktober abrufen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_historical_fetch.py

      - name: Historische Kursdaten als ZIP bereitstellen
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-historical-2026-08-to-10
          path: gold_historical_data/*.csv
          if-no-files-found: error
          retention-days: 14

      - name: Gold Langzeit Backtest Score 60 65 70
        run: python gold_long_backtest.py

      - name: Langzeit Backtest CSV exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-long-backtest-results
          path: gold_long_backtest_trades.csv
          if-no-files-found: error
          retention-days: 30

      - name: Langzeit Backtest Verluste analysieren
        run: python gold_long_diagnostics.py

      - name: Verlustanalyse CSV exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-long-backtest-diagnostics
          path: gold_long_backtest_diagnostics.csv
          if-no-files-found: error
          retention-days: 30

      - name: Timing und Same-Candle-Ausstiege pruefen
        run: python gold_trade_timing_audit.py

      - name: Timing-Pruefbericht exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-trade-timing-audit
          path: gold_trade_timing_audit.csv
          if-no-files-found: error
          retention-days: 30

      - name: Gold V3.9.6 konservativen Backtest ausfuehren
        run: python gold_long_backtest_v396.py && mv gold_long_backtest_trades.csv gold_long_backtest_v396_trades.csv

      - name: V3.9.6 Vergleichs-Trades exportieren
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-backtest-v396-results
          path: gold_long_backtest_v396_trades.csv
          if-no-files-found: error
          retention-days: 30
