
name: Historical Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Python-Syntax pruefen
        run: python -m py_compile gold_pilot_backtest.py
      
      
      - name: Gold Backtest Pilot ausfuehren
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_pilot_backtest.py

      - name: Backtest-CSV bereitstellen
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-pilot-backtest-trades
          path: gold_pilot_backtest_trades.csv
          if-no-files-found: error
          retention-days: 30

      - name: Historische Gold-Daten August bis Oktober abrufen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_historical_fetch.py

      - name: Historische Kursdaten als ZIP bereitstellen
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gold-historical-2026-08-to-10
          path: gold_historical_data/*.csv
          if-no-files-found: error
          retention-days: 14
