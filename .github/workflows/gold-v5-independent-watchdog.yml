name: Gold V5 Unabhaengiger Workflow Waechter
on:
  workflow_dispatch:
    inputs:
      test_incident:
        description: 'Nur Test: Stoerung erzeugen und danach automatisch schliessen'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '13,43 * * * *'
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GitHub Run-Historie unabhaengig kontrollieren
        uses: actions/github-script@v7
        with:
          script: |
            const workflow_id = "gold-v5-forward-paper.yml";
            const now = new Date();
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id, per_page: 50
            });
            const runs = response.data.workflow_runs || [];
            const successes = runs.filter(r => r.conclusion === "success");
            const latest = successes.length ? successes.reduce((a,b) =>
              new Date(a.updated_at) > new Date(b.updated_at) ? a : b) : null;
            const minutes = latest ? (now - new Date(latest.updated_at))/60000 : null;
            // Conservative time-based suppression for the approximate Friday-close
            // through Sunday-open market reference. Not broker-verified.
            const chi = new Intl.DateTimeFormat("en-US",{
              timeZone:"America/Chicago",weekday:"short",hour:"2-digit",
              minute:"2-digit",hourCycle:"h23"
            }).formatToParts(now).reduce((o,x)=>{o[x.type]=x.value;return o;},{});
            const m = Number(chi.hour)*60+Number(chi.minute);
            const day=chi.weekday;
            const paused = day==="Sat" || (day==="Fri" && m>=960) ||
              (day==="Sun" && m<1020) ||
              (["Mon","Tue","Wed","Thu"].includes(day) && m>=960 && m<1020);
            // A recent failed attempt is actionable even during trading pauses.
            const recentFailure = runs.find(r=>["failure","timed_out","cancelled"].includes(r.conclusion)
              && now-new Date(r.updated_at)<90*60000);
            let reasons=[];
            if (recentFailure) reasons.push("RECENT_FAILED_JOB:"+recentFailure.html_url);
            if (!paused && (minutes===null || minutes>75)) reasons.push("NO_RECENT_SUCCESS_IN_ACTIVE_SESSION");
            const report={checked_at_utc:now.toISOString(),approximate_reference_market_paused:paused,
              latest_success_url:latest?.html_url||null,
              minutes_since_success:minutes===null?null:Math.round(minutes*10)/10,
              recent_failure_url:recentFailure?.html_url||null,
              status:reasons.length?"ALERT":"OK",reasons,
              caveat:"This check is independent of the forward workflow but depends on scheduled GitHub Actions itself; market hours approximate, may flag holidays or delayed schedules."};
            core.info(JSON.stringify(report,null,2));
            await core.summary.addHeading("Gold V5 independent workflow watchdog")
              .addCodeBlock(JSON.stringify(report,null,2),"json").write();
            // Open/update one persistent issue per current incident to avoid repeat spam.
            const title = "[Gold V5] Forward-Workflow Stoerung";
            const issues = await github.paginate(github.rest.issues.listForRepo,{
              owner:context.repo.owner,repo:context.repo.repo,state:"open",per_page:100
            });
            const prior = issues.find(i=>i.title===title && !i.pull_request);
            const simulation = context.eventName === "workflow_dispatch" && context.payload.inputs?.test_incident === "true";
            if(simulation) reasons=["SIMULATED_WATCHDOG_TEST"]; 
            if(reasons.length) {
              const body = "Automatischer technischer Alarm (KEIN Trading-Signal).\\n\\n"
                + "Pruefung: "+now.toISOString()+"\\n"
                + "Fehler: "+reasons.join(", ")+"\\n"
                + "Letzter erfolgreicher Lauf: "+(latest?.html_url||"nicht gefunden")+"\\n"
                + "Pruefbericht siehe: "+context.serverUrl+"/"+context.repo.owner+"/"+context.repo.repo+"/actions/runs/"+context.runId;
              if(prior) {
                await github.rest.issues.createComment({
                  owner:context.repo.owner,repo:context.repo.repo,issue_number:prior.number,body
                });
              } else {
                await github.rest.issues.create({owner:context.repo.owner,
                  repo:context.repo.repo,title,body});
              }
              if(simulation) {
                const current = prior || (await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:"open",per_page:100})).data.find(i=>i.title===title && !i.pull_request);
                if(current){
                  await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:current.number,body:"TEST ENDE: Simulierte Stoerung behoben; Issue wird geschlossen."});
                  await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:current.number,state:"closed"});
                }
              } else core.setFailed(reasons.join("; "));
            } else if(prior) {
              await github.rest.issues.createComment({owner:context.repo.owner,
                repo:context.repo.repo,issue_number:prior.number,
                body:"Automatische Entwarnung: Workflow-Waechter meldet OK. Zeit: "+now.toISOString()});
              await github.rest.issues.update({owner:context.repo.owner,
                repo:context.repo.repo,issue_number:prior.number,state:"closed"});
            }
