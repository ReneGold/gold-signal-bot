name: Gold V5 Forward Audit (read-only)
on:
  push:
    branches:
      - gold-bot-v3-9-5-test
    paths:
      - gold_v5_forward_ledger.csv
      - gold_v5_forward_audit.py
      - test_gold_v5_forward_audit.py
      - .github/workflows/gold-v5-forward-audit.yml
      - gold_v5_telegram_notify.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-v5-forward-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit-Tests durchfuehren
        run: python -m unittest -v test_gold_v5_forward_audit.py
      - name: Forward-Ledger auswerten
        run: python gold_v5_forward_audit.py --output gold_v5_forward_audit.json
      - name: Bisherige Telegram-Signal-IDs laden
        uses: actions/cache/restore@v4
        with:
          path: gold_v5_telegram_sent.json
          key: gold-v5-telegram-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gold-v5-telegram-${{ github.ref_name }}-
      - name: Neue Paper-Signale an Telegram senden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram-Secrets fehlen. Kein Versand."
          else
            python gold_v5_telegram_notify.py
          fi
      - name: Telegram-Sendeprotokoll fuer naechsten Lauf sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: gold_v5_telegram_sent.json
          key: gold-v5-telegram-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Bericht als Workflow-Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v5-forward-audit-${{ github.run_number }}
          path: gold_v5_forward_audit.json
          if-no-files-found: warn
          retention-days: 30
