name: Daytrader V1 tests
on:
  push:
    branches: [gold-ai-daytrader-1]
    paths:
      - 'daytrader_v1/**'
      - '.github/workflows/daytrader-v1-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DAYTRADER_V1_ENABLED: '0'
      DAYTRADER_V1_TELEGRAM_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - run: python -m compileall -q daytrader_v1
      - run: python -m unittest daytrader_v1.test_core daytrader_v1.test_integration -v
