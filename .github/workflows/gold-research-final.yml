name: Gold Research FINAL – One Hypothesis
on:
  push:
    branches: [gold-research-v1]
    paths:
      - .github/workflows/gold-research-final.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and existing data safety tests
        run: |
          python -m py_compile gold_research_v1.py gold_research_v1_backtest.py gold_research_derive_h1.py gold_research_final_decision.py
          python -m unittest -v test_gold_research_v1.py test_gold_research_v1_backtest.py test_gold_research_derive_h1.py
      - name: Gold XAUUSD 15-minute history through 14 November 2026
        run: >
          npx --yes dukascopy-node@1.51.1 -i xauusd
          -from 2026-08-01 -to 2026-11-15 -t m15 -f csv -p bid
          -dir raw -fn gold15 --cache
          --batch-size 5 --batch-pause 2000 --rate-limit-retries 3
      - name: Validate gold data and derive completed hourly bars
        run: |
          python gold_research_import_dukascopy.py --source raw/gold15.csv --out data/gold15.csv --minutes 15
          python gold_research_derive_h1.py --bars15 data/gold15.csv --out data/gold1h.csv
      - name: Predeclared baseline vs one UTC session comparison
        run: >
          python gold_research_final_decision.py
          --bars15 data/gold15.csv --bars1h data/gold1h.csv
          --cost 0.8 --slippage 0
          --out out/final_gold_research.json
      - name: Save one final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-gold-research-report
          path: out/final_gold_research.json
          if-no-files-found: warn
          retention-days: 30
