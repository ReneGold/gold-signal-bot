name: Gold Oct 28 Short Diagnose (manuell)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test-Branch laden
        uses: actions/checkout@v4
        with:
          ref: gold-bot-v3-9-5-test
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt
      - name: Gold Short Ablehnungsgruende untersuchen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_oct28_short_diagnosis.py
      - name: Diagnose CSV herunterladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-oct28-short-diagnosis-${{ github.run_id }}
          path: gold_oct28_short_diagnosis.csv
          if-no-files-found: warn
