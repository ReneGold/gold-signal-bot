name: Gold V5 Datenqualitaet (manuell)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Nur Gold Test-Branch laden
        uses: actions/checkout@v4
        with:
          ref: gold-bot-v3-9-5-test
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt
      - name: Gold historische Daten holen und Qualitaet pruefen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_data_quality_audit.py
      - name: Daten und Bericht exportieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v5-data-quality-${{ github.run_id }}
          path: gold_data_audit/
          if-no-files-found: warn
