name: Gold V5 Marktphasen Strategievergleich (manuell)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Gold Test-Branch laden
        uses: actions/checkout@v4
        with:
          ref: gold-bot-v3-9-5-test
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt
      - name: Historische Gold Daten laden
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_data_quality_audit.py
      - name: Drei Marktphasen Strategien getrennt simulieren
        run: python gold_v5_phase_policy_replay.py
      - name: Berichte exportieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v5-phase-policy-${{ github.run_id }}
          path: |
            gold_data_audit/gold_v5_phase_policy_summary.json
            gold_data_audit/gold_v5_phase_policy_trades.csv
          if-no-files-found: warn
