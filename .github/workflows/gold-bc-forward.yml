name: Gold B-C Forward Observation

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: gold-bc-shadow-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test-Branch lesen - keine Aenderung am Hauptbot
        uses: actions/checkout@v4
        with:
          ref: gold-bot-v3-9-5-test
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: pip install -r requirements.txt

      - name: Nur neue abgeschlossene Gold-Kerzen B und C protokollieren
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_forward_bc_shadow.py

      - name: V4 Marktbeobachtung und Sicherheitstests
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python -m unittest -v test_gold_v4_market_observer.py
          python gold_v4_market_observer.py

      - name: Beobachtungen deduplizieren und Paper-Trades verfolgen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_forward_bc_ledger.py

      - name: B C 20-80 Paper Exit Vergleich
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python -m unittest -v test_gold_forward_bc_exit_20_80.py
          python gold_forward_bc_exit_20_80.py

      - name: Gold B-C Telegram Tests
        run: python -m unittest -v test_gold_forward_bc_telegram.py

      - name: Neue Gold B-C Testsignale an Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gold_forward_bc_telegram.py

      - name: Nur Test-Branch-Historie speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_forward_bc_history.csv gold_forward_bc_paper_trades.csv gold_forward_bc_exit_20_80.csv gold_forward_bc_telegram_sent.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update B-C observation history [skip ci]"
            git push origin HEAD:gold-bot-v3-9-5-test
          else
            echo "Keine neuen Beobachtungen."
          fi

      - name: Beobachtungs-Snapshot exportieren
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bc-forward-${{ github.run_id }}
          path: |
            gold_forward_bc_snapshot.csv
            gold_v4_market_observation.json
            gold_forward_bc_exit_20_80.csv
          retention-days: 30
          if-no-files-found: error
