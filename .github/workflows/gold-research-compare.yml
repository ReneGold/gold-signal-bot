name: Gold Research Vergleich (manuell)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Nur Test-Branch laden
        uses: actions/checkout@v4
        with:
          ref: gold-bot-v3-9-5-test
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: pip install -r requirements.txt
      - name: Gold Pullback und Breakout vergleichen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_research_candidates.py
      - name: Ergebnisse exportieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-research-${{ github.run_id }}
          path: |
            gold_research_candidates.csv
            gold_research_summary.json
          if-no-files-found: warn
