# Alter Gold V3.9 Workflow archiviert: keine Zeitplanung und keine Telegram-Secrets.
# Manuell weiter als Konsolen-Diagnose nutzbar, ohne Benachrichtigungen.
name: Gold Signal Bot (V3.9 archiviert - ohne Telegram)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Alter Gold-Bot nur im Konsolenmodus - kein Telegram
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          GITHUB_ACTIONS: "true"
          STATE_FILE: "/tmp/gold-v39-diagnostic-state.json"
        run: python gold_signal_bot.py
