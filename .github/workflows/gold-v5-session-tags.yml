name: Gold V5 Session Kennzeichnung (manuell)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Test-Branch laden
        uses: actions/checkout@v4
        with:
          ref: gold-bot-v3-9-5-test
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: pip install -r requirements.txt
      - name: Golddaten laden
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_data_quality_audit.py
      - name: Referenzhandelszeiten zuordnen
        run: python gold_v5_session_tags.py
      - name: Markierte Kursdaten und Bericht exportieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v5-session-tags-${{ github.run_id }}
          path: gold_data_audit/
          if-no-files-found: warn
