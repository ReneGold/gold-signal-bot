name: Gold V5 Wochenend und Feed Pruefung (manuell)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Test-Branch laden
        uses: actions/checkout@v4
        with:
          ref: gold-bot-v3-9-5-test
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: pip install -r requirements.txt
      - name: Kursdaten neu einlesen
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_data_quality_audit.py
      - name: Wochenende und Datenkonsistenz analysieren
        run: python gold_session_integrity.py
      - name: Berichte exportieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v5-session-check-${{ github.run_id }}
          path: gold_data_audit/
          if-no-files-found: warn
