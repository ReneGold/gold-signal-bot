name: Gold V5 Verlustdiagnose (manuell)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Nur Gold Test-Branch laden
        uses: actions/checkout@v4
        with:
          ref: gold-bot-v3-9-5-test
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: pip install -r requirements.txt
      - name: Historische Golddaten laden
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_data_quality_audit.py
      - name: A B Handelssimulation
        run: python gold_v5_session_ab.py
      - name: Verluste analysieren
        run: python gold_v5_loss_diagnostic.py
      - name: Auswertungen exportieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v5-loss-diagnostic-${{ github.run_id }}
          path: |
            gold_data_audit/gold_v5_loss_diagnostic.json
            gold_data_audit/gold_v5_loss_trade_details.csv
            gold_data_audit/gold_v5_session_ab_summary.json
          if-no-files-found: warn
